name: litex port

on:
  push:
    paths:
      - '.github/workflows/ports_litex.yml'
      - 'tools/**'
      - 'py/**'
      - 'extmod/**'
      - 'lib/**'
      - 'drivers/**'
      - 'ports/litex/**'
  pull_request:
    paths:
      - '.github/workflows/ports_litex.yml'
      - 'tools/**'
      - 'py/**'
      - 'extmod/**'
      - 'lib/**'
      - 'drivers/**'
      - 'ports/litex/**'

# Allow one run per ref, cancelling in-progress builds when new commits land.
concurrency:
  group: ports-litex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          verilator \
          socat \
          gcc-riscv64-unknown-elf \
          libnewlib-dev \
          libevent-dev \
          libjson-c-dev \
          python3-pip \
          python3-venv

    - name: Install LiteX
      run: |
        mkdir -p $HOME/litex && cd $HOME/litex
        wget -q https://raw.githubusercontent.com/enjoy-digital/litex/master/litex_setup.py
        chmod +x litex_setup.py
        # --init clones/updates all litex-hub repos; --install installs them
        # into ~/.local via pip; --config=standard picks the usual cores.
        ./litex_setup.py --init --install --config=standard --user
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Show tool versions
      run: |
        verilator --version
        riscv64-unknown-elf-gcc --version | head -1
        python3 -m litex.tools.litex_sim --help | head -1 || true

    - name: Generate sim SoC (headers + libs only, skip Verilator build)
      run: |
        python3 -m litex.tools.litex_sim \
          --cpu-type=vexriscv \
          --integrated-main-ram-size=0x01000000 \
          --libc-mode=full \
          --output-dir=/tmp/litex_mpy_sim \
          --no-compile-gateware

    - name: Build MicroPython firmware for the sim target
      run: |
        make -C ports/litex BUILD_DIRECTORY=/tmp/litex_mpy_sim -j$(nproc)

    - name: Run sim smoke test
      run: |
        make -C ports/litex BUILD_DIRECTORY=/tmp/litex_mpy_sim test

    - name: Dump sim log on failure
      if: failure()
      run: |
        echo "=== last 200 lines of /tmp/litex_sim.log ==="
        tail -200 /tmp/litex_sim.log 2>/dev/null || echo "(no log found)"
