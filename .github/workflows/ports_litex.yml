name: litex port

on:
  push:
    paths:
      - '.github/workflows/ports_litex.yml'
      - 'tools/**'
      - 'py/**'
      - 'extmod/**'
      - 'shared/**'
      - 'lib/**'
      - 'drivers/**'
      - 'ports/litex/**'
  pull_request:
    paths:
      - '.github/workflows/ports_litex.yml'
      - 'tools/**'
      - 'py/**'
      - 'extmod/**'
      - 'shared/**'
      - 'lib/**'
      - 'drivers/**'
      - 'ports/litex/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpu: [vexriscv]
    steps:
    - uses: actions/checkout@v4
    # Cache LiteX install (~/.local from `pip --user`, ~/litex from
    # `litex_setup.py --init`). Cold install is ~3 min; cached restore
    # is ~5 s. Key includes ci.sh so the cache invalidates whenever we
    # change what gets installed.
    - name: Cache LiteX install
      id: cache-litex
      uses: actions/cache@v4
      with:
        path: |
          ~/.local
          ~/litex
        key: litex-install-${{ runner.os }}-${{ hashFiles('tools/ci.sh', '.github/workflows/ports_litex.yml') }}
        restore-keys: |
          litex-install-${{ runner.os }}-
    - name: Install packages
      run: tools/ci.sh ci_litex_setup
    - name: Build firmware and run sim tests (${{ matrix.cpu }})
      run: tools/ci.sh ci_litex_build_sim ${{ matrix.cpu }}
    - name: Dump sim log on failure
      if: failure()
      run: |
        echo "=== last 200 lines of /tmp/litex_sim.log ==="
        tail -200 /tmp/litex_sim.log 2>/dev/null || echo "(no log found)"

  build_boards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        board: [digilent_arty]
    steps:
    - uses: actions/checkout@v4
    - name: Cache LiteX install
      id: cache-litex
      uses: actions/cache@v4
      with:
        path: |
          ~/.local
          ~/litex
        key: litex-install-${{ runner.os }}-${{ hashFiles('tools/ci.sh', '.github/workflows/ports_litex.yml') }}
        restore-keys: |
          litex-install-${{ runner.os }}-
    - name: Install packages
      run: tools/ci.sh ci_litex_setup
    - name: Build firmware for ${{ matrix.board }}
      run: tools/ci.sh ci_litex_build_board ${{ matrix.board }}
